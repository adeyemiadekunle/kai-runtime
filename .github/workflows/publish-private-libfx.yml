name: Publish private libfx

# The Kai runtime's libfx, published to GitHub Packages as @kunemi-group/kai
# and one @kunemi-group/kai-<platform> package per platform, and the fx command
# for Dotrix's coding image as @kunemi-group/kai-cli-linux-x64 and -arm64. The repository's
# GITHUB_TOKEN can't publish to the kunemi-group organisation, so the
# KAI_PACKAGES_TOKEN secret holds a token with write:packages there. Dotrix's Chat host installs it from there. Started by hand, from a
# commit on main, with a version such as 0.0.17-kai.1; a version already
# published is never replaced. scripts/package-private-libfx.sh does the
# packing, checks and publishing, so it can also be run locally.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version, such as 0.0.17-kai.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-private-libfx
  cancel-in-progress: false

jobs:
  metadata:
    if: github.repository == 'adeyemiadekunle/kai-runtime'
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.metadata.outputs.sha }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Check the version
        id: metadata
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          BASE_VERSION=$(grep 'pub const version' src/main.zig | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if ! [[ "$VERSION" =~ ^${BASE_VERSION//./\\.}-kai\.[0-9]+$ ]]; then
            echo "::error::version must be ${BASE_VERSION}-kai.<n>, not ${VERSION}"
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  native:
    needs: metadata
    name: Native (${{ matrix.package_platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            package_platform: linux-x64
            target_flags: -Dtarget=x86_64-linux-gnu.2.34 -Dcpu=baseline
          - runner: ubuntu-24.04-arm
            package_platform: linux-arm64
            target_flags: -Dtarget=aarch64-linux-gnu.2.34 -Dcpu=baseline
          - runner: macos-15-intel
            package_platform: darwin-x64
          - runner: macos-15
            package_platform: darwin-arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.metadata.outputs.sha }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.17.1"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Build ReleaseSafe addon
        run: zig build libfx-napi -Dnapi-surface=core -Doptimize=ReleaseSafe -Dupdate-channel=stable ${{ matrix.target_flags }}
      - name: Check Linux ABI baseline
        if: startsWith(matrix.package_platform, 'linux-')
        run: python3 sdk/scripts/check-linux-abi.py zig-out/lib/libfx.node
      - name: Test native addon
        run: npm run --prefix sdk test:node-napi
      - name: Name the addon for packaging
        run: |
          mkdir -p native-addons
          cp zig-out/lib/libfx.node native-addons/libfx.${{ matrix.package_platform }}.node
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: libfx-native-${{ matrix.package_platform }}
          path: native-addons/libfx.${{ matrix.package_platform }}.node
          if-no-files-found: error

  cli:
    needs: metadata
    name: fx command (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.metadata.outputs.sha }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.17.1"
      # Static builds, as fx's own Linux releases are, for Dotrix's coding image.
      - name: Build fx for Linux x64 and arm64
        run: |
          mkdir -p fx-bins
          for arch in x86_64 aarch64; do
            zig build -Doptimize=ReleaseSafe -Dcpu=baseline -Dupdate-channel=stable -Dkai-release=${{ needs.metadata.outputs.version }} -Dtarget=${arch}-linux-musl
            cp zig-out/bin/fx fx-bins/fx-${arch}
          done
          scripts/smoke-binary.sh fx-bins/fx-x86_64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kai-cli
          path: fx-bins/
          if-no-files-found: error

  cli-macos:
    needs: metadata
    name: fx command (${{ matrix.package_platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: macos-15
            package_platform: darwin-arm64
          - runner: macos-15-intel
            package_platform: darwin-x64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.metadata.outputs.sha }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.17.1"
      - name: Build fx for ${{ matrix.package_platform }}
        run: |
          zig build -Doptimize=ReleaseSafe -Dcpu=baseline -Dupdate-channel=stable -Dkai-release=${{ needs.metadata.outputs.version }}
          scripts/smoke-binary.sh zig-out/bin/fx
      - name: Sign and notarize fx when Apple credentials are configured
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_SIGNING_IDENTIFIER: ${{ vars.APPLE_SIGNING_IDENTIFIER || 'com.kunemi.kai' }}
          APPLE_SIGNING_TEAM_ID: ${{ secrets.APPLE_SIGNING_TEAM_ID }}
        run: |
          set -euo pipefail
          mkdir -p fx-bins
          cp zig-out/bin/fx "fx-bins/fx-${{ matrix.package_platform }}"
          if [ -n "${APPLE_DEVELOPER_ID_P12_BASE64:-}" ] && [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
            scripts/sign-and-notarize-macos.sh "fx-bins/fx-${{ matrix.package_platform }}"
          else
            codesign --force --sign - "fx-bins/fx-${{ matrix.package_platform }}"
            codesign --verify --strict "fx-bins/fx-${{ matrix.package_platform }}"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kai-cli-${{ matrix.package_platform }}
          path: fx-bins/fx-${{ matrix.package_platform }}
          if-no-files-found: error

  publish:
    needs: [metadata, native, cli, cli-macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.metadata.outputs.sha }}
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: "0.17.1"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.18.0"
      # The package checks run under Bun as well as Node (the version CI uses).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: libfx-native-*
          path: native-addons
          merge-multiple: true
      - name: Build WebAssembly surfaces
        run: |
          zig build -Dwasm-surface=core -Doptimize=ReleaseSmall -Dupdate-channel=stable
          zig build -Dwasm-surface=term -Doptimize=ReleaseSmall -Dupdate-channel=stable
          npm ci --prefix sdk/tools
          node sdk/scripts/optimize-wasm.mjs zig-out/bin/fx-core.wasm zig-out/bin/fx-term.wasm
      - name: Install the durable Worlds
        run: npm ci --prefix sdk/durable
      - name: Pack, check, and publish
        env:
          LIBFX_VERSION: ${{ needs.metadata.outputs.version }}
          LIBFX_SOURCE_COMMIT: ${{ needs.metadata.outputs.sha }}
          NODE_AUTH_TOKEN: ${{ secrets.KAI_PACKAGES_TOKEN }}
        run: scripts/package-private-libfx.sh native-addons out --publish
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: kai-cli*
          path: fx-bins
          merge-multiple: true
      - name: Pack and publish the fx command
        env:
          LIBFX_VERSION: ${{ needs.metadata.outputs.version }}
          LIBFX_SOURCE_COMMIT: ${{ needs.metadata.outputs.sha }}
          NODE_AUTH_TOKEN: ${{ secrets.KAI_PACKAGES_TOKEN }}
        run: scripts/package-private-cli.sh fx-bins out --publish
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: libfx-private-packages
          path: |
            out/*.tgz
            out/native/*.tgz
            out/packages.sha256
            out/cli/*.tgz
            out/cli/fx.sha256
          if-no-files-found: error
