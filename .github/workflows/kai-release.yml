name: Kai release

# Tags a published Kai runtime version and creates its GitHub release, from docs/releases/v<version>.md
# on main. Started by hand once the version's packages are on GitHub Packages
# (publish-private-libfx.yml or scripts/package-private-libfx.sh). The tag is v<version>, on the commit
# the packages were built from (a lightweight tag the release creates); an existing tag or release is never
# moved or replaced.

on:
  workflow_dispatch:
    inputs:
      version:
        description: The published version, such as 0.0.17-kai.1
        required: true
        type: string
      commit:
        description: The full SHA of the commit @kunemi-group/kai records as its gitHead
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    if: github.repository == 'adeyemiadekunle/kai-runtime'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - name: Check the version, the commit, and the notes
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-kai\.[0-9]+$ ]] || { echo "::error::version must look like 0.0.17-kai.1"; exit 1; }
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::commit must be a full SHA"; exit 1; }
          git merge-base --is-ancestor "$COMMIT" origin/main || { echo "::error::$COMMIT is not on main"; exit 1; }
          [ -s "docs/releases/v${VERSION}.md" ] || { echo "::error::docs/releases/v${VERSION}.md is missing"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null; then
            echo "::error::v${VERSION} is already tagged"; exit 1
          fi
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          # The release creates the tag on the commit itself. A `git push` of the tag is refused: the commit's
          # workflow files differ from main's, and this token may not create a ref that changes workflows.
          gh release create "v${VERSION}" --target "$COMMIT" --title "Kai runtime ${VERSION}" --notes-file "docs/releases/v${VERSION}.md"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/v${VERSION}" --jq .sha)" = "$COMMIT"
